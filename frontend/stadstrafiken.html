<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Stadstrafiken Örebro - LTlive</title>
  <link rel="stylesheet" href="stadstrafiken.css">
</head>
<body>
  <div id="header">
    <a href="/">← Karta</a>
    <h1>Stadstrafiken Örebro</h1>
    <div class="line-badges" id="line-badges"></div>
    <div id="vehicle-counts"></div>
    <div id="toolbar">
      <button id="btn-labels" title="Visa/dölj hållplatsnamn">Dölj namn</button>
      <button id="btn-fit" title="Visa hela kartan">Hela kartan</button>
    </div>
  </div>

  <div id="map-wrapper">
    <svg id="main-svg" xmlns="http://www.w3.org/2000/svg">
      <g id="g-pan">
        <rect id="paper" x="0" y="0" fill="#ffffff"/>
        <g id="g-edges"></g>
        <g id="g-nodes"></g>
        <g id="g-labels"></g>
        <g id="g-vehicles"></g>
      </g>
    </svg>
  </div>

  <div id="loading-overlay">Laddar kartdata...</div>
  <div id="err-bar"></div>

  <div id="dep-panel">
    <div id="dep-handle"></div>
    <div id="dep-header">
      <div id="dep-stop-name">Hållplats</div>
      <button id="dep-close">×</button>
    </div>
    <div id="dep-lines"></div>
    <div id="dep-content"></div>
  </div>
  <div id="last-update"></div>

  <script type="module" src="stadstrafiken.js"></script>
  <script src="analytics.js"></script>
</body>
</html>
